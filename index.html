<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerador de Escalas de Trabalho</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        min-height: 100%;
      }
      body {
        background: #f4f6fa;
        color: #1a2138;
        font-family: "Inter", "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      select {
        font-family: inherit;
        font-size: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: not-allowed;
      }
      /* Foco de teclado sempre visivel */
      :focus-visible {
        outline: 2px solid #101c3d;
        outline-offset: 2px;
      }
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f3f8;
      }
      ::-webkit-scrollbar-thumb {
        background: #ccd2e0;
        border-radius: 8px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #aab6da;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
